# nginx site for zig-web on the Pi, reached through the Cloudflare tunnel.
#
# Cloudflare terminates HTTPS. cloudflared on this host forwards requests to
# nginx on http://localhost:80, and nginx picks this site by its server_name.
# nginx sends /static/ from disk and proxies everything else to the app.
#
# Install:
#
#     sudo cp deploy/nginx/zig_web.conf deploy/nginx/zig_web_compress.conf /etc/nginx/snippets/
#     sudo cp deploy/nginx/site.conf /etc/nginx/sites-available/zig-web
#     sudo ln -s /etc/nginx/sites-available/zig-web /etc/nginx/sites-enabled/
#     sudo nginx -t && sudo systemctl reload nginx
#
# Then add a public hostname to the tunnel in the Cloudflare dashboard
# (Zero Trust > Networks > Tunnels > the tunnel > Public Hostname):
#
#     app.example.com  ->  HTTP  localhost:80
#
# Requires /etc/nginx/conf.d/tunnel-proxy.conf, which defines
# $tunnel_scheme and $tunnel_client_ip (the visitor's address from
# CF-Connecting-IP, trusted only from cloudflared on 127.0.0.1).

# Per-visitor rate limit for the app (not for /static/).
limit_req_zone $tunnel_client_ip zone=app_limit:10m rate=10r/s;

# A slower per-visitor limit for login attempts (POST /login), against
# password guessing. Other requests have an empty key, which nginx does not
# limit.
map "$request_method:$uri" $app_login_key {
    "POST:/login" $tunnel_client_ip;
    default "";
}
limit_req_zone $app_login_key zone=app_login:1m rate=10r/m;

upstream zig_web {
    # PORT in /home/pi/zig-web/.env.
    server 127.0.0.1:8090;
    keepalive 16;
    # Shorter than the app's keepalive timeout (75s), so nginx closes idle
    # connections first.
    keepalive_timeout 60s;
}

server {
    listen 80;
    server_name app.example.com;

    include /etc/nginx/snippets/zig_web.conf;
}
