# Compression for zig-web responses, included by deploy/nginx/zig_web.conf.
# Install as /etc/nginx/snippets/zig_web_compress.conf.
# Cloudflare asks the origin for "gzip, br"; Brotli is smaller.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
brotli on;
brotli_comp_level 4;
brotli_types text/css text/javascript application/javascript application/json image/svg+xml;
