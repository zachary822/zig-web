# zig-web routes, included by deploy/nginx/site.conf. Install as
# /etc/nginx/snippets/zig_web.conf.
#
# The app runs with SERVE_STATIC=false, because nginx sends /static/ and
# /media/.

# Static files in STATIC_ROOT, copied by `zig build collectstatic` (after
# `zig build css`). The pages use the hashed names, for example
# css/style.3f2a9c1b7d4e.css, so a changed file gets a new URL. No
# Cache-Control header: Cloudflare applies its own caching rules (Browser
# Cache TTL and edge cache).
location /static/ {
    alias /var/www/zig-web/static/;
    add_header X-Content-Type-Options "nosniff";
    include /etc/nginx/snippets/zig_web_compress.conf;
}

# Uploaded files in MEDIA_DIR (see src/library.zig). The names are random and
# are never used again. Only the types of the upload kinds get their content
# type (a test in src/library.zig checks this list); a different file gets
# application/octet-stream, and the CSP gives it no scripts or styles. When
# a kind does not show inline (library.Kind.show_inline), add a location for
# its extensions with `add_header Content-Disposition attachment`. No
# compression: the images are compressed.
location /media/ {
    alias /var/www/zig-web/media/;
    types {
        image/jpeg jpg;
        image/png png;
        image/gif gif;
        image/webp webp;
    }
    default_type application/octet-stream;
    add_header X-Content-Type-Options "nosniff";
    add_header Content-Security-Policy "default-src 'none'; sandbox";
}

location / {
    # app_limit and app_login are defined in deploy/nginx/site.conf.
    limit_req zone=app_limit burst=20 nodelay;
    limit_req zone=app_login burst=5 nodelay;
    limit_req_status 429;

    # Uploads: the largest file of all kinds and the form around it
    # (upload.requestSize(library.max_size) in src/main.zig; a test in
    # src/library.zig checks this value). The other settings come from
    # this location.
    location = /uploads {
        client_max_body_size 11m;
        proxy_pass http://zig_web;
    }

    proxy_pass http://zig_web;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $tunnel_client_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $tunnel_scheme;

    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    # Larger request bodies only for uploads (above).
    client_max_body_size 1m;

    include /etc/nginx/snippets/zig_web_compress.conf;
}
